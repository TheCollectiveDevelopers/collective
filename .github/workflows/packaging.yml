name: Build and Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION: '6.10.0'
  CMAKE_VERSION: '3.28.x'
  APP_NAME: 'collective'

jobs:
  autotag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.autotag.outputs.new-tag}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto Tag
        id: autotag
        uses: phish108/autotag-action@v1.1.55
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: autotag
    if: always()
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        version: [free, paid]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtpdf qt5compat qtshadertools'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake
        run: |
          $USE_PAID = if ("${{ matrix.version }}" -eq "paid") { "ON" } else { "OFF" }
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} -DUSE_PAID_VERSION=$USE_PAID

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          cd build/Release
          windeployqt appcollective.exe --qmldir ../../qml --release --compiler-runtime

      - name: Prepare MSIX layout
        run: |
          New-Item -ItemType Directory -Path msix -Force | Out-Null
          xcopy build\Release msix\ /E /I /Y
          Copy-Item packaging\windows\appx\AppxManifest.xml msix\AppxManifest.xml -Force
          New-Item -ItemType Directory -Path msix\Assets -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          function New-MsixIcon($Size, $OutputPath) {
            $source = [System.Drawing.Image]::FromFile("${{ github.workspace }}\assets\icon.png")
            $bitmap = New-Object System.Drawing.Bitmap $Size, $Size
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.DrawImage($source, 0, 0, $Size, $Size)
            $bitmap.Save($OutputPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            $source.Dispose()
          }

          New-MsixIcon 44 "${{ github.workspace }}\msix\Assets\Square44x44Logo.png"
          New-MsixIcon 50 "${{ github.workspace }}\msix\Assets\StoreLogo.png"
          New-MsixIcon 150 "${{ github.workspace }}\msix\Assets\Square150x150Logo.png"

          if (Test-Path msix\vc_redist.x64.exe) {
            Remove-Item msix\vc_redist.x64.exe -Force
          }

      - name: Create MSIX package
        run: |
          $makeappx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($makeappx) {
            & $makeappx.FullName pack /d msix /p collective-windows-x86_64-${{ matrix.version }}.msix /o
          } else {
            Write-Host "makeappx not found, trying from PATH"
            makeappx pack /d msix /p collective-windows-x86_64-${{ matrix.version }}.msix /o
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            collective-windows-x86_64-${{ matrix.version }}.msix
          tag_name: ${{ needs.autotag.outputs.new-tag || 'latest' }}
          name: ${{ needs.autotag.outputs.new-tag || 'Latest Build' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: autotag
    if: always()
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        version: [free, paid]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qtpdf qt5compat qtshadertools'
          cache: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake
        run: |
          USE_PAID=${{ matrix.version == 'paid' && 'ON' || 'OFF' }}
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} -DUSE_PAID_VERSION=$USE_PAID

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt dependencies
        run: |
          macdeployqt build/appcollective.app -qmldir=qml -dmg
          mv build/appcollective.dmg build/collective-macos-${{ matrix.version }}.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/collective-macos-${{ matrix.version }}.dmg
          tag_name: ${{ needs.autotag.outputs.new-tag || 'latest' }}
          name: ${{ needs.autotag.outputs.new-tag || 'Latest Build' }}
          draft: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-appimage:
    needs: autotag
    if: always()
    runs-on: ubuntu-latest
    permissions:
          contents: write
    strategy:
      matrix:
        version: [free, paid]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-shape0 \
            libdbus-1-dev \
            libpulse-dev \
            libasound2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            file \
            wget

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia qt5compat qtpdf qtshadertools'
          cache: true

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Configure CMake
        run: |
          USE_PAID=${{ matrix.version == 'paid' && 'ON' || 'OFF' }}
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }} \
            -DUSE_PAID_VERSION=$USE_PAID

      - name: Build
        run: cmake --build build --config Release

      - name: Install to AppDir
        run: |
          DESTDIR=AppDir cmake --install build

      - name: Download linuxdeploy and Qt plugin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Create AppImage
        env:
          QMAKE: ${{ env.Qt6_DIR }}/bin/qmake
          UPDATE_INFORMATION: "zsync|https://collectiveboard.pages.dev/linux/Collective.AppImage.zsync"
        run: |
          # Create wrapper script
          cat > AppDir/usr/bin/appcollective-wrapper.sh <<EOF
          #!/bin/bash
          export QT_QPA_PLATFORM=xcb
          DIR="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$DIR/appcollective" "\$@"
          EOF
          chmod +x AppDir/usr/bin/appcollective-wrapper.sh

          # Create desktop file
          cat > collective.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Collective
          Exec=appcollective-wrapper.sh
          Icon=collective
          Categories=Utility;
          Terminal=false
          EOF

          # Copy icon
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/collective.png

          # Set environment variables for linuxdeploy
          export QML_SOURCES_PATHS=qml
          export EXTRA_QT_PLUGINS="multimedia"

          # Create AppImage
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file=collective.desktop \
            --icon-file=assets/icon.png \
            --output appimage

      - name: Rename AppImage
        run: |
          mv Collective-*.AppImage Collective-${{ matrix.version }}.AppImage || true
          ls -la *.AppImage

      - name: Generate zsync file
        run: |
          sudo apt-get install -y zsync
          zsyncmake -u https://collectiveboard.pages.dev/linux/Collective-${{ matrix.version }}.AppImage Collective-${{ matrix.version }}.AppImage

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Collective-${{ matrix.version }}.AppImage
            Collective-${{ matrix.version }}.AppImage.zsync
          tag_name: ${{ needs.autotag.outputs.new-tag || 'latest' }}
          name: ${{ needs.autotag.outputs.new-tag || 'Latest Build' }}
          draft: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
